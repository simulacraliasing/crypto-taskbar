[package]
name = "crypto-taskbar-settings"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "CryptoTaskbarSettings"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
crypto-taskbar-core.workspace = true
gpui-kit = "=0.8.1"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1"
