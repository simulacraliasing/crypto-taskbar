[package]
name = "crypto-taskbar"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "CryptoTaskbar"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
crypto-taskbar-core.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Networking_WinHttp", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1"
