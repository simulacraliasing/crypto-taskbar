[workspace]
members = ["crates/core", "crates/app", "crates/settings"]
resolver = "2"

[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/simulacraliasing/crypto-taskbar"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crypto-taskbar-core = { path = "crates/core" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
